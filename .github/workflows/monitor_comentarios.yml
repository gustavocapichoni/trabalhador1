name: Monitor de Comentários Instagram

on:
  schedule:
    # Executa automaticamente a cada 15 minutos (frequência ideal do GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitorar-comentarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências Leves
        run: |
          python -m pip install --upgrade pip
          pip install requests loguru firebase-admin python-dotenv

      - name: Criar arquivo .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE" > .env

      - name: Executar Resposta Automática de Comentários
        env:
          IG_ACCESS_TOKEN_9: ${{ secrets.IG_ACCESS_TOKEN_9 }}
          IG_ACCOUNT_ID_9: ${{ secrets.IG_ACCOUNT_ID_9 }}
        run: |
          python core/publisher/gerenciador_comentarios.py
